services:
  postgres:
    image: postgres:13
    container_name: sms-postgres
    environment:
      POSTGRES_USER: stock
      POSTGRES_PASSWORD: stock123
      POSTGRES_DB: stock_matching
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock -d stock_matching"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis/redis-stack-server:latest
    container_name: sms-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sms-backend
    environment:
      PORT: "10020"
      DATABASE_URL: postgres://stock:stock123@postgres:5432/stock_matching?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      JWT_SECRET: stock-matching-jwt-secret-change-me
      JWT_EXPIRE_HOURS: "24"
      TZ: Asia/Shanghai
    ports:
      - "10020:10020"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /api/v1
    container_name: sms-frontend
    ports:
      - "6173:6173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
